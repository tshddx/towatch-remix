# fly.toml app configuration file generated for towatch-remix on 2026-05-08T11:44:52-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'towatch-remix'
primary_region = 'lax'

[build]

[env]
  DATABASE_PATH = '/data/app.db'
  NODE_ENV = 'production'
  PORT = '8080'
  SESSION_PATH = '/data/sessions'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
